[package]
name = "nextaros"
version = "1.0.0"
edition = "2021"
description = "NextarOS Desktop Environment"
authors = ["NextarOS"]
license = "MIT"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
dirs = "6"
sysinfo = "0.34"
notify = "7"
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
mime_guess = "2"
trash = "5"
open = "5"
whoami = "1"
libc = "0.2"

# Linux-specific dependencies
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
x11rb = { version = "0.13", features = ["all-extensions"] }
freedesktop-desktop-entry = "0.8"
xdg = "2.5"
nix = { version = "0.29", features = ["signal", "process", "fs"] }
libpulse-binding = "2"
libpulse-simple-binding = "2"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
calloop = "0.14"
futures-util = "0.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
